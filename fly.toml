# fly.toml app configuration file generated for backupta-oidc on 2026-04-28T18:05:59-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backupta-oidc'
primary_region = 'ord'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy'

[env]
  PORT = '4010'

[http_service]
  internal_port = 4010
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
